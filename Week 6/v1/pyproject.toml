[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "era-v5-session6"
version = "0.1.0"
description = "Laptop-scale auditable training-data execution system"
requires-python = ">=3.11"

[project.optional-dependencies]
corpus = ["pyarrow==18.1.0"]
training = ["pyarrow==18.1.0", "tokenizers==0.20.3", "torch==2.5.1"]

[tool.setuptools.packages.find]
where = ["src"]
