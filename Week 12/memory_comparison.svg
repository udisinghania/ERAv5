<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-labelledby="title desc">
  <title id="title">Persistent memory per rank for a 30 billion parameter model on 32 GPUs</title>
  <desc id="desc">Horizontal bars compare Data Parallel at 447.0 GiB, ZeRO-1 at 122.2 GiB, ZeRO-2 at 68.1 GiB, and ZeRO-3 at 14.0 GiB. A red dashed line marks a 74.5 GiB card limit.</desc>
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="410" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">Persistent Memory per Rank — 30B Model on 32 GPUs</text>
  <text x="410" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">Training state only, measured in GiB</text>

  <g stroke="#E5E7EB" stroke-width="1" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">
    <line x1="175" y1="58" x2="175" y2="315"/><text x="175" y="336" text-anchor="middle" stroke="none">0</text>
    <line x1="275" y1="58" x2="275" y2="315"/><text x="275" y="336" text-anchor="middle" stroke="none">80</text>
    <line x1="375" y1="58" x2="375" y2="315"/><text x="375" y="336" text-anchor="middle" stroke="none">160</text>
    <line x1="475" y1="58" x2="475" y2="315"/><text x="475" y="336" text-anchor="middle" stroke="none">240</text>
    <line x1="575" y1="58" x2="575" y2="315"/><text x="575" y="336" text-anchor="middle" stroke="none">320</text>
    <line x1="675" y1="58" x2="675" y2="315"/><text x="675" y="336" text-anchor="middle" stroke="none">400</text>
    <line x1="775" y1="58" x2="775" y2="315"/><text x="775" y="336" text-anchor="middle" stroke="none">480</text>
  </g>

  <line x1="268.1" y1="54" x2="268.1" y2="315" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="273" y="49" font-family="Arial, sans-serif" font-size="11" fill="#DC2626">74.5 GiB card limit</text>

  <g font-family="Arial, sans-serif" font-size="13" fill="#111827">
    <text x="163" y="109" text-anchor="end">Data Parallel</text>
    <rect x="175" y="88" width="558.8" height="30" rx="4" fill="#4B5563"/>
    <text x="742" y="109" font-size="12" font-weight="700">447.0 GiB</text>

    <text x="163" y="167" text-anchor="end">ZeRO-1</text>
    <rect x="175" y="146" width="152.8" height="30" rx="4" fill="#2563EB"/>
    <text x="336" y="167" font-size="12" font-weight="700">122.2 GiB</text>

    <text x="163" y="225" text-anchor="end">ZeRO-2</text>
    <rect x="175" y="204" width="85.1" height="30" rx="4" fill="#0EA5E9"/>
    <text x="318" y="225" font-size="12" font-weight="700">68.1 GiB</text>

    <text x="163" y="283" text-anchor="end">ZeRO-3</text>
    <rect x="175" y="262" width="17.5" height="30" rx="4" fill="#10B981"/>
    <text x="201" y="283" font-size="12" font-weight="700">14.0 GiB</text>
  </g>
</svg>
